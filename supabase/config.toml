[functions.paypal-capture-order]
enabled = true
verify_jwt = false
import_map = "./functions/paypal-capture-order/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/paypal-capture-order/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/paypal-capture-order/*.html" ]

# PayPal's server-to-server webhook carries no Supabase JWT, so verify_jwt MUST
# be false or the function 401s before its handler runs — silently disabling the
# captured-but-interrupted-purchase backstop (PAYMENT.CAPTURE.COMPLETED). The
# handler verifies authenticity itself via PayPal's verify-webhook-signature.
[functions.paypal-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-webhook/index.ts"

# The remaining four are always invoked WITH a Supabase JWT — client invoke()
# attaches the anon/user token, and the reminder cron passes the service-role key
# as bearer (which the function re-checks) — so verify_jwt = true is correct.
[functions.contact-message]
enabled = true
verify_jwt = true
entrypoint = "./functions/contact-message/index.ts"

[functions.newsletter-subscribe]
enabled = true
verify_jwt = true
entrypoint = "./functions/newsletter-subscribe/index.ts"

[functions.send-welcome-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-welcome-email/index.ts"

[functions.send-showtime-reminders]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-showtime-reminders/index.ts"

# Admin broadcast to a showtime's paid ticket holders. Called from the admin UI
# with the admin's user JWT, so verify_jwt = true rejects unauthenticated calls;
# the handler additionally checks the caller's profiles.role = 'admin'.
[functions.send-showtime-broadcast]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-showtime-broadcast/index.ts"
